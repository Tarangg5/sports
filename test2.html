<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        function redirectToApp() {
            // Target HLS Stream Link
            var targetUrl = "https://dishmt.slivcdn.com/hls/live/2020591-b/TEN3HD/master.m3u8|Cookie=hdnea=exp=1794054398~acl=/*~id=35083061525596278690298080425087~hmac=1ddff2b1e82c3da0240a8170a1b6bc9e61226ac5466a9881835ff71e7c52dfb1";
            
            // Android Intent Syntax to launch the specific package
            // It passes the stream URL as the data parameter
            var intentUrl = "intent://" + targetUrl.replace(/^https?:\/\//, "") + 
                            "#Intent;scheme=https;package=com.genuine.leone;end;";

            // Attempt to open the app via Intent
            window.location.href = intentUrl;

            // Fallback: If the app isn't installed or doesn't intercept, 
            // open the stream link in the browser after a short delay
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 2500);
        }

        // Run the redirect automatically when the page loads
        window.onload = redirectToApp;
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .loader {
            margin: 20px auto;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h2>Opening in Application...</h2>
    <p>If you are not redirected automatically, <a id="manual-link" href="#">click here</a>.</p>
    <div class="loader"></div>

    <script>
        // Update the manual link just in case auto-redirect is blocked by the browser
        document.getElementById('manual-link').href = "intent://" + 
            "dishmt.slivcdn.com/hls/live/2020591-b/TEN3HD/master.m3u8|Cookie=hdnea=exp=1794054398~acl=/*~id=35083061525596278690298080425087~hmac=1ddff2b1e82c3da0240a8170a1b6bc9e61226ac5466a9881835ff71e7c52dfb1" + 
            "#Intent;scheme=https;package=com.genuine.leone;end;";
    </script>

</body>
</html>
